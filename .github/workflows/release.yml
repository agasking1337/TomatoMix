name: Build & Release Windows MSI & EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag name to create a GitHub Release (e.g. v1.0.2). Leave empty to only upload workflow artifacts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build TomatoMix MSI & Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $rawTag = $env:GITHUB_REF_NAME
          } elseif (![string]::IsNullOrWhiteSpace("${{ inputs.tag_name }}")) {
            $rawTag = "${{ inputs.tag_name }}"
          } else {
            [xml]$csproj = Get-Content .\TomatoMix.csproj
            $projVer = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace($projVer)) { $projVer = "1.0.0" }
            $rawTag = "v$projVer"
          }
          $cleanVersion = $rawTag.TrimStart('v', 'V')
          if ($cleanVersion -notmatch '^\d+\.\d+\.\d+') {
            $cleanVersion = "1.0.0"
          }
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Tag: $rawTag (Version: $cleanVersion)"

      - name: Build WiX MSI Installer (TomatoMix.msi)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path $PWD "dist\publish"
          $toolsDir = Join-Path $PWD "dist\tools"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null

          # 1. Publish self-contained win-x64 build
          dotnet publish .\TomatoMix.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir

          # 2. Install WiX v5 CLI into local temporary tool path
          dotnet tool install wix --version 5.0.2 --tool-path $toolsDir
          $wixExe = Join-Path $toolsDir "wix.exe"

          # 3. Dynamically generate WiX source (TomatoMix.wxs)
          $icoPath = (Resolve-Path ".\Assets\app.ico").Path
          $wxsPath = ".\dist\TomatoMix.wxs"
          $wxsContent = @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package
              Name="TomatoMix Audio Mixer"
              Manufacturer="TomatoMix"
              Version="${{ steps.version.outputs.version }}"
              UpgradeCode="8F64B3A9-4A31-428C-9F35-720E810C99B4"
              Scope="perUser"
              Compressed="yes">

              <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
              <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

              <Icon Id="AppIcon.ico" SourceFile="$icoPath" />
              <Property Id="ARPPRODUCTICON" Value="AppIcon.ico" />

              <StandardDirectory Id="LocalAppDataFolder">
                <Directory Id="ProgramsFolder" Name="Programs">
                  <Directory Id="INSTALLFOLDER" Name="TomatoMix" />
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="TomatoMix" />
              </StandardDirectory>

              <StandardDirectory Id="DesktopFolder" />

              <Feature Id="MainFeature" Title="TomatoMix Audio Mixer" Level="1">
                <Files Directory="INSTALLFOLDER" Include="$publishDir\**">
                  <Exclude Files="$publishDir\TomatoMix.exe" />
                </Files>
                <Component Id="MainExecutable" Directory="INSTALLFOLDER">
                  <File Id="TomatoMixExe" Source="$publishDir\TomatoMix.exe" KeyPath="yes">
                    <Shortcut
                      Id="StartMenuShortcut"
                      Directory="ApplicationProgramsFolder"
                      Name="TomatoMix Audio Mixer"
                      Description="Multi-Channel Application Audio Router, Mixer &amp; 10-Band Equalizer"
                      WorkingDirectory="INSTALLFOLDER"
                      Icon="AppIcon.ico" />
                    <Shortcut
                      Id="DesktopShortcut"
                      Directory="DesktopFolder"
                      Name="TomatoMix Audio Mixer"
                      Description="Multi-Channel Application Audio Router, Mixer &amp; 10-Band Equalizer"
                      WorkingDirectory="INSTALLFOLDER"
                      Icon="AppIcon.ico" />
                  </File>
                  <RemoveFolder Id="RemoveApplicationProgramsFolder" Directory="ApplicationProgramsFolder" On="uninstall" />
                </Component>
              </Feature>
            </Package>
          </Wix>
          "@
          Set-Content -Path $wxsPath -Value $wxsContent.Trim() -Encoding UTF8

          # 4. Build TomatoMix.msi
          & $wixExe build $wxsPath -arch x64 -o ".\dist\TomatoMix.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }

      - name: Build Portable Single-File TomatoMix.exe
        shell: pwsh
        run: |
          dotnet publish .\TomatoMix.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\dist\portable

          Move-Item -Path ".\dist\portable\TomatoMix.exe" -Destination ".\dist\TomatoMix-Portable.exe" -Force

      - name: Upload Packages as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TomatoMix-Windows-x64-${{ steps.version.outputs.tag }}
          path: |
            dist/TomatoMix.msi
            dist/TomatoMix-Portable.exe
          if-no-files-found: error

      - name: Create GitHub Release & Attach Files
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TomatoMix Audio Mixer ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/TomatoMix.msi
            dist/TomatoMix-Portable.exe
