name: Build and Release

on:
  push:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Extract version from TomatoMix.csproj
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\TomatoMix.csproj -Raw
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not find Version in TomatoMix.csproj"
            exit 1
          }

          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version '$version' must use numeric Major.Minor.Patch format for MSI packaging"
            exit 1
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found version: $version"

      - name: Build WiX MSI Installer (TomatoMix.msi)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $publishDir = Join-Path $PWD "dist\publish"
          $toolsDir = Join-Path $PWD "dist\tools"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null

          dotnet publish .\TomatoMix.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish for MSI failed with exit code $LASTEXITCODE" }

          dotnet tool install wix --version 5.0.2 --tool-path $toolsDir
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed with exit code $LASTEXITCODE" }
          $wixExe = Join-Path $toolsDir "wix.exe"

          $icoPath = (Resolve-Path ".\Assets\app.ico").Path
          $wxsPath = ".\dist\TomatoMix.wxs"
          $wxsContent = @"
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package
              Name="TomatoMix Audio Mixer"
              Manufacturer="TomatoMix"
              Version="${{ steps.version.outputs.version }}"
              UpgradeCode="8F64B3A9-4A31-428C-9F35-720E810C99B4"
              Scope="perUser"
              Compressed="yes">

              <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
              <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

              <Icon Id="AppIcon.ico" SourceFile="$icoPath" />
              <Property Id="ARPPRODUCTICON" Value="AppIcon.ico" />

              <StandardDirectory Id="LocalAppDataFolder">
                <Directory Id="ProgramsFolder" Name="Programs">
                  <Directory Id="INSTALLFOLDER" Name="TomatoMix" />
                </Directory>
              </StandardDirectory>

              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="TomatoMix" />
              </StandardDirectory>

              <StandardDirectory Id="DesktopFolder" />

              <Feature Id="MainFeature" Title="TomatoMix Audio Mixer" Level="1">
                <Files Directory="INSTALLFOLDER" Include="$publishDir\**">
                  <Exclude Files="$publishDir\TomatoMix.exe" />
                </Files>
                <Component Id="MainExecutable" Directory="INSTALLFOLDER">
                  <File Id="TomatoMixExe" Source="$publishDir\TomatoMix.exe" KeyPath="yes">
                    <Shortcut
                      Id="StartMenuShortcut"
                      Directory="ApplicationProgramsFolder"
                      Name="TomatoMix Audio Mixer"
                      Description="Multi-Channel Application Audio Router, Mixer &amp; 10-Band Equalizer"
                      WorkingDirectory="INSTALLFOLDER"
                      Icon="AppIcon.ico" />
                    <Shortcut
                      Id="DesktopShortcut"
                      Directory="DesktopFolder"
                      Name="TomatoMix Audio Mixer"
                      Description="Multi-Channel Application Audio Router, Mixer &amp; 10-Band Equalizer"
                      WorkingDirectory="INSTALLFOLDER"
                      Icon="AppIcon.ico" />
                  </File>
                  <RemoveFolder Id="RemoveApplicationProgramsFolder" Directory="ApplicationProgramsFolder" On="uninstall" />
                </Component>
              </Feature>
            </Package>
          </Wix>
          "@
          Set-Content -Path $wxsPath -Value $wxsContent.Trim() -Encoding UTF8

          & $wixExe build $wxsPath -arch x64 -o ".\dist\TomatoMix.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed with exit code $LASTEXITCODE" }

      - name: Build Portable Single-File TomatoMix.exe
        shell: pwsh
        run: |
          dotnet publish .\TomatoMix.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\dist\portable
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish for portable EXE failed with exit code $LASTEXITCODE" }

          Move-Item -Path ".\dist\portable\TomatoMix.exe" -Destination ".\dist\TomatoMix-Portable.exe" -Force

      - name: Upload Packages as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TomatoMix-Windows-x64-v${{ steps.version.outputs.version }}
          path: |
            dist/TomatoMix.msi
            dist/TomatoMix-Portable.exe
          if-no-files-found: error

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          $baseTag = "v${{ steps.version.outputs.version }}"
          $tag = $baseTag
          $buildNumber = 1

          while ($true) {
            $existingRef = git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null
            $tagExists = $LASTEXITCODE -eq 0
            if (-not $tagExists) { break }

            $buildNumber++
            $tag = "$baseTag-$buildNumber"
            Write-Host "Tag $baseTag exists, trying $tag"
          }

          if ($buildNumber -eq 1) {
            $title = "${{ github.event.repository.name }} | $baseTag"
          } else {
            $title = "${{ github.event.repository.name }} | $baseTag#$buildNumber"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag (Title: $title)"

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $newTag = "${{ steps.tag.outputs.tag }}"
          $notes = ""

          if (Test-Path .\CHANGELOG.md) {
            $lines = Get-Content .\CHANGELOG.md
            $headingPattern = "^## \[v?$([regex]::Escape($version))\]"
            $sectionStart = -1

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match $headingPattern) {
                $sectionStart = $i + 1
                break
              }
            }

            if ($sectionStart -ge 0) {
              $sectionLines = [System.Collections.Generic.List[string]]::new()
              for ($i = $sectionStart; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^## \[') { break }
                $sectionLines.Add($lines[$i])
              }
              $notes = ($sectionLines -join "`n").Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Release v$version"
          }

          $previousTag = git describe --tags --abbrev=0 2>$null
          if ($LASTEXITCODE -ne 0) { $previousTag = "" }
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $compareUrl = "https://github.com/${{ github.repository }}/compare/$($previousTag.Trim())...$newTag"
            $notes += "`n`n**Full Changelog**: $compareUrl"
          }

          $delimiter = [Guid]::NewGuid().ToString("N")
          $output = "body<<$delimiter`n$notes`n$delimiter`n"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $output)

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_TITLE: ${{ steps.tag.outputs.title }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: |
          gh release create $env:RELEASE_TAG `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes $env:RELEASE_NOTES `
            .\dist\TomatoMix.msi `
            .\dist\TomatoMix-Portable.exe

          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE" }
