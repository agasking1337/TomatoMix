name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag name to create a GitHub Release (e.g. v1.0.0). Leave empty to only upload workflow artifacts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build TomatoMix Setup & Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $rawTag = $env:GITHUB_REF_NAME
          } elseif (![string]::IsNullOrWhiteSpace("${{ inputs.tag_name }}")) {
            $rawTag = "${{ inputs.tag_name }}"
          } else {
            $rawTag = "v1.0.0"
          }
          $cleanVersion = $rawTag.TrimStart('v', 'V')
          if ($cleanVersion -notmatch '^\d+\.\d+\.\d+') {
            $cleanVersion = "1.0.0"
          }
          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Tag: $rawTag (Version: $cleanVersion)"

      - name: Build TomatoMix-Setup.exe Installer
        shell: pwsh
        run: |
          .\build-installer.ps1

      - name: Build Portable Single-File TomatoMix.exe
        shell: pwsh
        run: |
          dotnet publish .\TomatoMix.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\dist\portable

          Move-Item -Path ".\dist\portable\TomatoMix.exe" -Destination ".\dist\TomatoMix-Portable.exe" -Force

      - name: Upload Executables as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TomatoMix-Windows-x64-${{ steps.version.outputs.tag }}
          path: |
            dist/TomatoMix-Setup.exe
            dist/TomatoMix-Portable.exe
          if-no-files-found: error

      - name: Create GitHub Release & Attach EXE Files
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TomatoMix Audio Mixer ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/TomatoMix-Setup.exe
            dist/TomatoMix-Portable.exe
